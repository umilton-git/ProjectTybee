[project]
name = "tybee-backend"
version = "0.1.0"
description = "Backend API for Tybee gesture drawing app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools]
py-modules = ["main", "database", "model", "schemas", "images"]